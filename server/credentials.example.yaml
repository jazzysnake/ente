# Copy to credentials.yaml beside compose.yaml.
# Museum loads this file before museum.yaml because ENTE_CREDENTIALS_FILE is set
# to /credentials.yaml in compose.yaml.

# Secrets that should stay out of museum.yaml.
db:
  password: <postgres-password>

s3:
  b2-eu-cen:
    key: <backblaze-key-id>
    secret: <backblaze-application-key>

# Generate fresh values with:
#   cd server
#   go run tools/gen-random-keys/main.go
key:
  encryption: <generated-value>
  hash: <generated-value>

jwt:
  secret: <generated-value>

# Optional SMTP secrets.
# smtp:
#   username: <smtp-username>
#   password: <smtp-password>
