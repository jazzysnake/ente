# Sample docker compose file, not meant for production use.

services:
  museum:
    build:
      context: .
      args:
        GIT_COMMIT: development-cluster
    ports:
      - 8080:8080 # API
      # - 2112:2112 # Prometheus metrics (uncomment to access externally)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENTE_CREDENTIALS_FILE: /credentials.yaml
    networks:
      - museum-backend

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpass}
      POSTGRES_DB: ${POSTGRES_DB:-ente_db}
    healthcheck:
      test: pg_isready -q -d ${POSTGRES_DB:-ente_db} -U ${POSTGRES_USER:-pguser}
      start_period: 40s
      start_interval: 1s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - museum-backend

volumes:
  postgres-data:

networks:
  museum-backend:
    driver: bridge
